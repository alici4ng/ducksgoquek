<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Travelero — Shade Engine Demo (Bandar Sunway)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: rgba(255,255,255,.93); padding: 12px 16px; border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25); width: 280px;
    }
    #panel h3 { margin: 0 0 8px; font-size: 15px; }
    #time-label { font-size: 20px; font-weight: 600; }
    #slider { width: 100%; margin-top: 8px; }
    .hint { font-size: 11px; color: #555; margin-top: 8px; line-height: 1.4; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h3>Estimated building shade — Bandar Sunway</h3>
  <div id="time-label">--:--</div>
  <input id="slider" type="range" min="0" max="0" value="0" step="1" />
  <div class="hint">
    <span class="swatch" style="background:#4a3aff;opacity:.45"></span>computed shadow
    &nbsp;
    <span class="swatch" style="background:#888"></span>building<br/>
    Drag the slider to move through the day. Shadows are estimated from OSM
    footprints + sun position — not survey-accurate.
  </div>
</div>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '&copy; OpenStreetMap contributors'
      }
    },
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
  },
  center: [101.607, 3.0695],
  zoom: 15.2
});

let buckets = [];
const slider = document.getElementById('slider');
const timeLabel = document.getElementById('time-label');

function fmt(b) { return b.slice(0, 2) + ':' + b.slice(2); }

async function setBucket(i) {
  const b = buckets[i];
  timeLabel.textContent = fmt(b);
  const data = await fetch(`shadows_${b}.geojson`).then(r => r.json());
  const src = map.getSource('shadows');
  if (src) src.setData(data);
}

map.on('load', async () => {
  const meta = await fetch('meta.json').then(r => r.json());
  buckets = meta.buckets;
  slider.max = buckets.length - 1;
  slider.value = buckets.indexOf('1000');  // demo sweet spot per PRD: 10am or 4pm

  const buildings = await fetch('buildings.geojson').then(r => r.json());
  map.addSource('buildings', { type: 'geojson', data: buildings });
  map.addLayer({
    id: 'buildings', type: 'fill', source: 'buildings',
    paint: { 'fill-color': '#888', 'fill-opacity': 0.55, 'fill-outline-color': '#555' }
  });

  map.addSource('shadows', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'shadows', type: 'fill', source: 'shadows',
    paint: { 'fill-color': '#4a3aff', 'fill-opacity': 0.38 }
  });

  await setBucket(Number(slider.value));
});

slider.addEventListener('input', e => setBucket(Number(e.target.value)));
</script>
</body>
</html>
